services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kahvem
      POSTGRES_PASSWORD: kahvem_test
      POSTGRES_DB: kahvemnerede_test
    ports:
      - "5450:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kahvem -d kahvemnerede_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  app-test:
    build: .
    ports:
      - "3099:3000"
    environment:
      DATABASE_URL: "postgresql://kahvem:kahvem_test@postgres-test:5432/kahvemnerede_test?schema=public"
      SESSION_SECRET: "test-session-secret-32-chars-minimum!!"
      APP_ORIGIN: "http://localhost:3099"
      NEXT_PUBLIC_APP_URL: "http://localhost:3099"
      NODE_ENV: production
    depends_on:
      postgres-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
